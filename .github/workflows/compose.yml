name: Compose

on:
  push:
    branches: [main]
    paths: &paths
      - docker-compose.yml
      - .env.example
      - deploy/**
      - .github/workflows/compose.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose files and deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate with defaults
        run: docker compose config --quiet

      - name: Validate with .env.example
        run: docker compose --env-file .env.example config --quiet

      - name: Validate release overlay per environment
        env:
          REGISTRY: ghcr.io/example
          VERSION: latest
        run: |
          for environment in deploy/environments/*.env; do
            echo "Checking $environment"
            docker compose --env-file "$environment" -f docker-compose.yml -f deploy/compose.release.yml config --quiet
          done

      - name: ShellCheck deploy scripts
        run: shellcheck deploy/*.sh

      - name: Dry-run a deployment
        env:
          DEPLOY_DRY_RUN: "1"
          REGISTRY: ghcr.io/example
        run: deploy/deploy.sh staging sha-0000000
