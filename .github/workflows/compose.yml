name: Compose

on:
  push:
    branches: [main]
    paths: &paths
      - docker-compose.yml
      - .env.example
      - .github/workflows/compose.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate with defaults
        run: docker compose config --quiet

      - name: Validate with .env.example
        run: docker compose --env-file .env.example config --quiet
