name: Frontend

on:
  push:
    branches: [main]
    paths: &paths
      - frontend/**
      # Types are generated from the gateway's schema snapshot; a schema change must keep the app compiling.
      - backend/src/Services/Gateway/Telemetry.Gateway.Api/schema.graphql
      - .github/workflows/frontend.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      # Production dependencies are what ships to browsers; dev-only advisories are reviewed by hand.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check generated GraphQL types are up to date
        run: |
          npm run codegen
          git diff --exit-code -- src/app/core/graphql/generated.ts \
            || { echo "::error::generated.ts is stale - run 'npm run codegen' and commit the result."; exit 1; }

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/telemetry-dashboard/browser
          retention-days: 7

  image:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/telemetry-frontend
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=telemetry-frontend
          cache-to: type=gha,mode=max,scope=telemetry-frontend
