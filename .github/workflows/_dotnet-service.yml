# Reusable pipeline for one backend component: format check, warning-free Release build, unit and
# integration tests (Testcontainers) with coverage, then a Docker image (pushed to GHCR from main).
name: .NET service (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Display name of the component.
        required: true
        type: string
      project-dirs:
        description: Space-separated directories (relative to backend/) whose projects are format-checked.
        required: true
        type: string
      unit-tests:
        description: Unit test project directory (relative to backend/).
        required: true
        type: string
      integration-tests:
        description: Integration test project directory (relative to backend/).
        required: true
        type: string
      dockerfile:
        description: Dockerfile (relative to backend/). Leave empty for libraries without an image.
        required: false
        type: string
        default: ''
      image:
        description: Image name, published as ghcr.io/<owner>/<image>.
        required: false
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore "${{ inputs.unit-tests }}"
          dotnet restore "${{ inputs.integration-tests }}"

      - name: Check formatting and code style
        run: |
          for project in $(find ${{ inputs.project-dirs }} -name '*.csproj' | sort); do
            echo "::group::dotnet format $project"
            dotnet format "$project" --verify-no-changes --no-restore --severity warn
            echo "::endgroup::"
          done

      # Directory.Build.props sets TreatWarningsAsErrors, so analyzer (StyleCop, Sonar, CA) findings fail here.
      - name: Build
        run: |
          dotnet build "${{ inputs.unit-tests }}" --configuration Release --no-restore
          dotnet build "${{ inputs.integration-tests }}" --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test --project "${{ inputs.unit-tests }}" --configuration Release --no-build
          --results-directory "${{ github.workspace }}/test-results/unit"
          --report-xunit-trx --report-xunit-markdown
          --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml

      # Starts real RabbitMQ / PostgreSQL containers through Testcontainers (Docker is preinstalled).
      - name: Integration tests
        run: >
          dotnet test --project "${{ inputs.integration-tests }}" --configuration Release --no-build
          --results-directory "${{ github.workspace }}/test-results/integration"
          --report-xunit-trx --report-xunit-markdown
          --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml

      - name: Publish test summary
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s globstar nullglob
          for report in test-results/**/*.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.image || inputs.name }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Docker image
    needs: verify
    if: ${{ inputs.dockerfile != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
