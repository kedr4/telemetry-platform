name: telemetry

# Single entry point for the whole platform: `docker compose up --build`.
# Every value has a development default; override any of them in a `.env` file (see .env.example).

x-restart: &restart
  restart: unless-stopped

# .NET service images have no curl/wget; probe the readiness endpoint with bash's /dev/tcp.
x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

x-rabbitmq-env: &rabbitmq-env
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: ${RABBITMQ_USER:-telemetry}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-telemetry}

services:
  # ---------------------------------------------------------------------------
  # External, intentionally unstable API (third-party, built from its git repo).
  # ---------------------------------------------------------------------------
  weakapp:
    <<: *restart
    build:
      context: https://github.com/nantonov/WeakApp.git#c6451dc54c65e066ff8f42671bb99461793845fd
    image: telemetry/weakapp:c6451dc
    ports:
      - "${WEAKAPP_PORT:-5080}:8080"
    networks: [backend]
    healthcheck:
      # The aspnet base image has no curl/wget; use bash's /dev/tcp instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q OK <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  rabbitmq:
    <<: *restart
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-telemetry}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-telemetry}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------
  ingestor:
    <<: *restart
    build:
      context: ./backend
      dockerfile: src/Services/Ingestor/Telemetry.Ingestor/Dockerfile
    image: telemetry/ingestor:latest
    environment:
      <<: *rabbitmq-env
      WeakApi__BaseUrl: http://weakapp:8080
      WeakApi__ApiKey: ${WEAKAPP_API_KEY:-supersecret}
    ports:
      - "${INGESTOR_PORT:-5101}:8080"
    networks: [backend]
    depends_on:
      weakapp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # The processor declares the queue the ingestor publishes to (publishes are mandatory).
      processor:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  processor:
    <<: *restart
    build:
      context: ./backend
      dockerfile: src/Services/Processor/Telemetry.Processor/Dockerfile
    image: telemetry/processor:latest
    environment:
      <<: *rabbitmq-env
      ConnectionStrings__Telemetry: Host=postgres;Port=5432;Database=${POSTGRES_DB:-telemetry};Username=${POSTGRES_USER:-telemetry};Password=${POSTGRES_PASSWORD:-telemetry}
    ports:
      - "${PROCESSOR_PORT:-5102}:8080"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  gateway:
    <<: *restart
    build:
      context: ./backend
      dockerfile: src/Services/Gateway/Telemetry.Gateway.Api/Dockerfile
    image: telemetry/gateway:latest
    environment:
      ConnectionStrings__Telemetry: Host=postgres;Port=5432;Database=${POSTGRES_DB:-telemetry};Username=${POSTGRES_USER:-telemetry};Password=${POSTGRES_PASSWORD:-telemetry}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${GATEWAY_PORT:-5103}:8080"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      # The processor creates the schema the gateway reads.
      processor:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  notifications:
    <<: *restart
    build:
      context: ./backend
      dockerfile: src/Services/Notifications/Telemetry.Notifications/Dockerfile
    image: telemetry/notifications:latest
    environment:
      <<: *rabbitmq-env
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${NOTIFICATIONS_PORT:-5104}:8080"
    networks: [backend]
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

networks:
  backend:
    name: telemetry-backend

volumes:
  rabbitmq-data:
  postgres-data:
