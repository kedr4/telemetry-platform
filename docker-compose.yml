name: telemetry

# Single entry point for the whole platform: `docker compose up --build`.
# Every value has a development default; override any of them in a `.env` file (see .env.example).

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # External, intentionally unstable API (third-party, built from its git repo).
  # ---------------------------------------------------------------------------
  weakapp:
    <<: *restart
    build:
      context: https://github.com/nantonov/WeakApp.git#c6451dc54c65e066ff8f42671bb99461793845fd
    image: telemetry/weakapp:c6451dc
    ports:
      - "${WEAKAPP_PORT:-5080}:8080"
    networks: [backend]
    healthcheck:
      # The aspnet base image has no curl/wget; use bash's /dev/tcp instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q OK <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  rabbitmq:
    <<: *restart
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-telemetry}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-telemetry}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  backend:
    name: telemetry-backend

volumes:
  rabbitmq-data:
  postgres-data:
